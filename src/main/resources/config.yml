# AnimalDespawn 0.4.0
#
# Configurations older than 0.4.0 are automatically replaced with this
# configuration on plugin startup.
#
# Presets:
#   BETA_1_7_3  - classic Beta passive-mob despawning:
#                  >128 blocks = immediate removal
#                  >32 blocks after 600 ticks = 1/800 random roll
#   LEGACY_CONSOLE - legacy-style preset; follows the classic model.
#   BEDROCK      - Bedrock-style preset; follows the classic model.
#   CUSTOM       - use the despawn values below.
#
# Presets affect DESPAWNING only. Paper remains responsible for spawning.

config-version: 0.4.0

preset: BETA_1_7_3

enabled: true

despawn:
  maximum-distance: 128
  minimum-distance: 32
  minimum-age-ticks: 600
  random-check-bound: 800

  # How often this plugin examines loaded animals.
  scan-interval-ticks: 20

  # Safety valve: never remove more than this many animals in one scan.
  maximum-removals-per-scan: 8

protection:
  # Tamed animals are always protected.
  tamed: true

  # Player-attached/interacted animals remain protected.
  leashed: true
  named: true
  fed: true
  bred: true

  # Untamed Tameable animals (wolves, ocelots, horses, donkeys, llamas,
  # mules) remain eligible even if a player merely feeds them. Once tamed,
  # the tamed protection above applies.

  babies: true
  sheared: true
  dyed: true
  wolf-collar-dyed: true

animals:
  COW: true
  PIG: true
  SHEEP: true
  CHICKEN: true
  RABBIT: true
  MUSHROOM_COW: true
  WOLF: true
  OCELOT: true
  POLAR_BEAR: true
  HORSE: true
  DONKEY: true
  MULE: true
  LLAMA: true

worlds:
  whitelist: []
  blacklist: []

debug:
  enabled: false
  spawning: false
